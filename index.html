<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerechten Selector</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f5f5f7; color: #1d1d1f; }
        h1 { font-size: 24px; text-align: center; color: #ff3b30; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea, select, input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #d2d2d7; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        textarea { height: 150px; font-family: monospace; }
        button { width: 100%; padding: 14px; background: #007aff; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button:active { background: #0056b3; }
        pre { background: white; padding: 15px; border-radius: 8px; border: 1px solid #d2d2d7; white-space: pre-wrap; font-family: monospace; font-size: 14px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>🍽️ Gerechten Selector</h1>
    
    <label for="fileInput">1. Upload bestand of plak tekst</label>
    <input type="file" id="fileInput" accept=".txt">
    <textarea id="textInput" placeholder="Freddy: Tom Kha Kai, Pinsa&#10;Nadine: Tom Kha Kai, Mi-cuit zalm&#10;Sylvia: Pulpo, Pinsa"></textarea>

    <label for="pInput">2. Maximaal aantal gerechten (P)</label>
    <input type="number" id="pInput" value="2" min="1">

    <label for="modeInput">3. Optimalisatiemodus</label>
    <select id="modeInput">
        <option value="opt">Optimaal (Beste score)</option>
        <option value="max">Max (Unieke personen)</option>
        <option value="fair">Fair (Eerlijke verdeling)</option>
        <option value="popular">Populariteit (Meeste stemmen)</option>
    </select>

    <button id="calcBtn">Bereken Optimaal Menu</button>

    <label style="margin-top: 25px;">📊 Uitvoer Resultaat:</label>
    <pre id="output">Het resultaat verschijnt hier...</pre>

    <script type="module">
        import init, { select_dishes } from './pkg/gerechten_selector_web.js';

        async function run() {
            await init(); // Initialiseer de WebAssembly module

            // Bestandslezer koppelen aan het tekstveld
            document.getElementById('fileInput').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('textInput').value = evt.target.result;
                };
                reader.readAsText(file);
            });

            // Berekening starten bij klik
            document.getElementById('calcBtn').addEventListener('click', () => {
                const text = document.getElementById('textInput').value;
                const p = parseInt(document.getElementById('pInput').value) || 2;
                const mode = document.getElementById('modeInput').value;
                
                const result = select_dishes(text, p, mode);
                document.getElementById('output').textContent = result;
            });
        }
        run();
    </script>
</body>
</html>
